server:
  port: 8080
logging:
  file:
    path: /var/log
  level:
    org:
      springframework:
        security: debug
      jooq: info
cors:
  allowedOrigins: "http://localhost,https://localhost,http://localhost:8080,http://localhost:5173"
  allowedMethods: "*"
  allowedHeaders: "*"
  allowedExposeHeaders: "*"
spring:
  main:
    web-application-type: servlet
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.web.tomcat.TomcatMetricsAutoConfiguration
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:robot_monitor;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
management:
  metrics:
    binders:
      processor:
        enabled: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
jwt:
  secret: "secret"
  expiration-min: 100
  cookie-name: "jwt"
