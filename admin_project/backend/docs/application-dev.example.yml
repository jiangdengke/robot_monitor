server:
  port: 7075
  servlet:
    context-path: /api

spring:
  datasource:
    druid:
      master:
        url: jdbc:mysql://127.0.0.1:3306/robot_monitor?useSSL=false&useUnicode=true&characterEncoding=UTF8&autoReconnect=true
        username: root
        password: change_me
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: change_me

robot:
  url: http://127.0.0.1:8070/robot

deepglint:
  base-url: http://127.0.0.1:3154/api

robotmonitor:
  profile: /tmp/robotmonitor-upload
