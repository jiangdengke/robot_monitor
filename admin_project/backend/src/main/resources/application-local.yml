# Local bootstrap profile for the single Spring Boot backend

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: jdbc:mysql://127.0.0.1:3306/robot_monitor?useSSL=false&useUnicode=true&characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai
        username: root
        password: 123456
      slave:
        enabled: false
      initialSize: 1
      minIdle: 1
      maxActive: 5
      maxWait: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        url-pattern: /druid/*
        login-username: robotmonitor
        login-password: 123456
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  data:
    redis:
      client-type: jedis
      host: 127.0.0.1
      port: 6380
      database: 0
      password: 1234%%6
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: false
      fail-on-null-for-primitives: false
  ai:
    openai:
      base-url: http://127.0.0.1:11434/
      api-key: local-dev
      chat:
        completions-path: /v1/chat/completions
        options:
          model: qwen3:8b
      embedding:
        options:
          model: Qwen3-Embedding-4B
          dimensions: 2560
    vectorstore:
      redis:
        index-name: spring_ai_index
        initialize-schema: true
        prefix: "doc:"
  kafka:
    listener:
      auto-startup: false
    consumer:
      bootstrap-servers:
        - 127.0.0.1:9092
      auto-offset-reset: earliest
      max-poll-records: 2000
      enable-auto-commit: false
      auto-commit-interval: 1000
      session-timeout: 20000
      max-poll-interval: 15000
      max-partition-fetch-bytes: 10485760
      group-id: local-dev-group
      topic: local-dev-topic
      topic-gate: local-dev-topic-gate
      group-gate-id: local-dev-group-gate
    face:
      bootstrap-servers: 127.0.0.1:32400
      group-id: face-group
      auto-offset-reset: earliest
      topic: face

server:
  port: 7075
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 200
      min-spare: 20

logging:
  level:
    com.robotmonitor: info
    org.springframework: warn
    org.apache.kafka: warn

robot:
  url: http://127.0.0.1:8070/robot
  voice-url:
    whisper-voice: http://127.0.0.1:8000/api/model/whisper
    sense-voice: http://127.0.0.1:5432/api/model/SenseVoiceSmall

robotmonitor:
  serviceCode: CA
  ltsUrl: http://127.0.0.1:18080/openapi
  ltsAppId: local
  ltsAppKey: local
  profile: /tmp/robotmonitor-upload
  roomCode: PEK2DX1

deepglint:
  base-url: http://127.0.0.1:3154/api
  access-key: local
  secret-key: local
  auth-key: local
  repo-id: local
  image-width: 1920
  image-height: 1080
  recognition-type: face

call-center:
  es-chat-url: http://127.0.0.1:18081/deepseek/es_chat
  problem-source: 智慧休息
  agent: 休息室机器人
  default-long-sentence: 请严格控制在30个字以内回复我，并使用%s语言回答：%s
