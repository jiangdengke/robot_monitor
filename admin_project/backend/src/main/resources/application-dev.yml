    kafka:
        consumer:
            bootstrap-servers:
                - 10.150.140.59:9093
                - 10.150.140.206:9093
                - 10.150.140.133:9093
            auto-offset-reset: earliest                           #新建消费组时从什么位置开始消费  latest：最近位置   earliest：最早位置
            max-poll-records: 2000                              #批量消费一次最大拉取的数据量
            enable-auto-commit: false                           #是否开启自动提交
            auto-commit-interval: 1000                          #自动提交的间隔时间，自动提交开启时生效
            session-timeout: 20000                              #连接超时时间
            max-poll-interval: 15000                            #手动提交设置与poll的心跳数,如果消息队列中没有消息，等待毫秒后，调用poll()方法。如果队列中有消息，立即消费消息，每次消费的消息的多少可以通过max.poll.records配置。
            max-partition-fetch-bytes: 10485760                 #设置拉取数据的大小,10M
            group-id: ARDT_HGH_TO_LI_FLIGHT_XML_V002
            group-gate-id: ARDT_HGH_TO_LI_FLIGHT_RESOURCE_XML_V001    #消费组
            topic: OUTBOUND_AIRLINE_HGH_ARDT_FLIGHT_XML_V002
            topic-gate: OUTBOUND_AIRLINE_HGH_ARDT_FLIGHT_RESOURCE_XML_V001 #主题
        face:
